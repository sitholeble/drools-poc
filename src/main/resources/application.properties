server.port=8080
spring.application.name=drools-poc

# Logging
logging.level.com.dijkstrack.drools=DEBUG
logging.level.org.drools=INFO

# ILP optimization (CPLEX / Gurobi via Python scripts)
# Solver: "python" = run ilp_*.py (docplex/gurobipy/pulp), "greedy" = in-JVM fallback
optimization.solver=python
# Path to directory containing ilp_class_allocation.py, ilp_workout_plan.py, ilp_equipment_scheduling.py (empty = current dir)
optimization.python.path=
optimization.python.executable=python3


